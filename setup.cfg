[pycodestyle]
# See https://pycodestyle.readthedocs.io/en/latest/intro.html#configuration
# for details of these configuration options.
#
# These are normally ignored by default:
# ignore = E121, E123, E126, E133, E226, E241, E242, E704, W503, W504
#
# In addition to the default set we add:
# - E741: do not use variables named 'l', 'O', or 'I' -- because, for example,
#   'l' might refer to Galactic longitude.
#
# And "E501: line too long" is not ignored but modified by max-line-length.
max-line-length = 195
ignore = E126, E226, E741, W504

[flake8]
# See https://flake8.pycqa.org/en/latest/user/configuration.html
# for details of these configuration options. They are similar to pycodestyle.
#
# These are issues that are currently seen:
# - E226: missing whitespace around arithmetic operator
# - E241: multiple spaces after ','
# - F401: object imported but unused
# - F841: local variable ... is assigned to but never used
# - W504: line break after binary operator
max-line-length = 195
max-doc-length = 120
# Deliberately ignore nothing so that the statistics of can be printed in tests.
ignore =
